# fly.toml file generated for modulo-de-facturas

app = "modulo-de-facturas"
primary_region = "qro" # Región recomendada para México (Querétaro). Puedes cambiarla según tu cercanía.

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Montamos el volumen de disco persistente para que no se borren tus facturas de SQLite
[[mounts]]
  source = "cfdi_data"
  destination = "/data"

[env]
  DB_PATH = "/data/cfdi_data.db"
