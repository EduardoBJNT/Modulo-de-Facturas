<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Recuperar contraseña | App Facturas Recibidas</title>
<link rel="stylesheet" href="/static/styles.css?v=20260703-auth">
</head>
<body class="auth-body">
<main class="auth-shell">
<section class="auth-card" aria-label="Recuperar contraseña">
<div class="auth-brand">
<div class="auth-logo">AFR</div>
<div>
<div class="auth-brand-name">App Facturas Recibidas</div>
<div class="auth-brand-sub">Repositorio CFDI</div>
</div>
</div>
<h1>Restablecer contraseña</h1>
{% if error %}
<div class="auth-alert">{{ error }}</div>
{% endif %}
{% if sent %}
<div class="auth-alert auth-alert-ok">Si el correo existe, recibirás un enlace para restablecer tu contraseña.</div>
{% else %}
<form class="auth-form" method="post" action="/recuperar-password">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input name="email" type="email" autocomplete="email" placeholder="Correo electrónico" maxlength="254" required autofocus>
<button class="auth-submit" type="submit">Enviar enlace</button>
</form>
{% endif %}
<div class="auth-footer">
<a href="/login">Volver a ingresar</a>
</div>
</section>
</main>
</body>
</html>
