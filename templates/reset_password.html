<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nueva contraseña | App Facturas Recibidas</title>
<link rel="stylesheet" href="/static/styles.css?v=20260703-auth">
</head>
<body class="auth-body">
<main class="auth-shell">
<section class="auth-card" aria-label="Nueva contraseña">
<div class="auth-brand">
<div class="auth-logo">AFR</div>
<div>
<div class="auth-brand-name">App Facturas Recibidas</div>
<div class="auth-brand-sub">Repositorio CFDI</div>
</div>
</div>
<h1>Nueva contraseña</h1>
{% if error %}
<div class="auth-alert">{{ error }}</div>
{% endif %}
{% if done %}
<div class="auth-alert auth-alert-ok">Contraseña actualizada. Ya puedes ingresar.</div>
<div class="auth-footer">
<a href="/login">Ingresar</a>
</div>
{% else %}
<form class="auth-form" method="post" action="/restablecer-password/{{ token }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="auth-password">
<input id="password" name="password" type="password" autocomplete="new-password" placeholder="Nueva contraseña" minlength="8" maxlength="128" required autofocus>
<button type="button" aria-label="Mostrar contraseña" onclick="togglePassword('password', this)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
<div class="auth-password">
<input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" placeholder="Confirmar contraseña" minlength="8" maxlength="128" required>
<button type="button" aria-label="Mostrar contraseña" onclick="togglePassword('password_confirm', this)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
<button class="auth-submit" type="submit">Actualizar contraseña</button>
</form>
{% endif %}
</section>
</main>
<script>
function togglePassword(id, btn){
  const input=document.getElementById(id);
  input.type=input.type==='password'?'text':'password';
  btn.setAttribute('aria-label', input.type==='password'?'Mostrar contraseña':'Ocultar contraseña');
}
</script>
</body>
</html>
